# Helper для проксування WebSocket (HMR Vite). Має бути в http{} контексті —
# Homebrew nginx підключає цей файл саме там. Вихідна змінна має **проектний
# префікс** (`swc_`), бо `map` оголошується на рівні http{}, спільному для всіх
# локальних проектів: дефолтне ім'я `$connection_upgrade` дало б у nginx -t
# "duplicate map" при колізії з іншим проектом. Інша змінна → конфлікту немає.
map $http_upgrade $swc_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── http://sync.loc ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name sync.loc;

    # API → бекенд; трейлінг-слеш у proxy_pass зрізає префікс /api/
    location /api/ {
        proxy_pass http://127.0.0.1:10331/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Усе інше → Vite dev-server (+ HMR websocket через Upgrade)
    location / {
        proxy_pass http://127.0.0.1:10332;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $swc_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── https://sync.dev ─────────────────────────────────────────────────────
# Канонічний HMR-endpoint (wss://sync.dev) — обслуговує і sync.loc, і sync.dev.
server {
    listen 443 ssl;
    http2 on;
    server_name sync.dev;

    # ↓↓↓ заміни на свої шляхи (mkcert/openssl)
    ssl_certificate     /Users/user/.ssl/sync.dev/sync.dev.pem;
    ssl_certificate_key /Users/user/.ssl/sync.dev/sync.dev-key.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:10331/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:10332;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $swc_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# (опційно) http://sync.dev → редірект на https
server {
    listen 80;
    server_name sync.dev;
    return 301 https://$host$request_uri;
}
